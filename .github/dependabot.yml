# Dependency updates, which are the only mitigation A06 actually has.
#
# A vulnerable dependency is not a thing you write a test against — the
# vulnerability is in somebody else's code and did not exist when the version was
# pinned. What you can have is a process that notices, and `pnpm audit` in CI is
# the wrong shape for one: a new advisory published against a transitive package
# turns every unrelated pull request red, on a repository whose rule is that a
# red check is never merged. That trains people to merge red. A pull request per
# update does the same job with the failure pointed at the thing that changed.
#
# `scripts/assert-owasp-checklist.ts` reads this file, so deleting it or dropping
# an ecosystem fails a CI gate rather than quietly ending the updates.
version: 2
updates:
  # Application dependencies. pnpm's lockfile is understood natively, so the
  # pull requests carry a resolved `pnpm-lock.yaml` and CI's
  # `--frozen-lockfile` install is what proves it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Batched by risk rather than by package, so the weekly volume is two or
    # three reviewable pull requests instead of thirty.
    #
    # Patch and minor updates of the dev toolchain are the ones nobody needs to
    # read individually; a major of anything, and any update to a runtime
    # dependency, arrives on its own. The version pins in CLAUDE.md are
    # deliberate, so a major is a decision rather than a merge.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-patch:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # The framework majors are pinned on purpose — see the version list in
      # CLAUDE.md, which every gate in this repository is written against.
      # Security patches still arrive, because those are minors and patches.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The workflows themselves, which are code that runs with this repository's
  # secrets. Every `uses:` is pinned to a commit digest rather than a tag, so
  # this entry is the only thing that ever moves one: Dependabot resolves the
  # action's newest release, rewrites the SHA *and* the trailing `# vX.Y.Z`
  # comment together, and the diff says which release the new bytes came from.
  # Without this entry a digest-pinned workflow is frozen rather than hardened —
  # it keeps running whatever was current the day it was written, advisories
  # included. `scripts/assert-action-pins.ts` rule P4 fails the loss of this
  # entry, and fails an `ignore:` added inside it, because ignoring an action
  # here is the quiet version of deleting it.
  #
  # `directory: /` means `.github/workflows`, and only that. Dependabot has no
  # view of `workflow-templates/`, which this repository also ships — so the
  # templates' pins are held to the workflow's by rule P3 of the same gate
  # rather than by anything GitHub runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
